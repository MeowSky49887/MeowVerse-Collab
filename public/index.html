<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VTogether</title>
        <link rel="stylesheet" href="style.css">
        <link href="./libs/overlayscrollbars.css" rel="stylesheet" type="text/css"/>
        <script src="./libs/overlayscrollbars.browser.es6.min.js" defer></script>

        <script>
            if (!window.spout) {
                window.location.replace(
                    "https://github.com/MeowSky49887/VTogether"
                );
            }
        </script>
    </head>
    <body>
        <div id="scrollBox" data-overlayscrollbars-y>
            <div id="hostBox">
                <h2 id="boxHeader">Join Collab Room</h2>

                <input id="roomId" placeholder="Room ID">
                <input id="password" type="password" placeholder="Password">
                
                <div class="scene-manager">
                    <label id="sceneLabel">
                        Load/Save Scene
                        <input type="checkbox" id="continueScene">
                    </label>
                    <button id="clearSceneBtn" type="button">
                        Clear Saved Scene
                    </button>
                </div>

                <h3>Video Settings</h3>

                <div class="select-wrapper">
                    <select id="spout2Select"></select>
                </div>

                <canvas id="videoCanvas"></canvas>
                <video id="mainVideo" hidden></video>

                <button id="joinBtn">Join</button>
            </div>
        </div>

        <div id="scene"></div>

        <script src="/socket.io/socket.io.js"></script>
        <script type="module" src="app.js"></script>

        <script type="module">
            var { 
                OverlayScrollbars, 
                ScrollbarsHidingPlugin, 
                SizeObserverPlugin, 
                ClickScrollPlugin  
            } = OverlayScrollbarsGlobal;

            document.querySelectorAll("[data-overlayscrollbars]").forEach((element) => {
                OverlayScrollbars(
                    element,
                    {
                        overflow: {},
                        update: {
                            elementEvents: [['textarea', 'input']],
                            debounce: [0, 0]
                        }
                    }
                );
            });

            document.querySelectorAll("[data-overlayscrollbars-x]").forEach((element) => {
                OverlayScrollbars(
                    element,
                    {
                        overflow: { y: "hidden" },
                        update: {
                            elementEvents: [['textarea', 'input']],
                            debounce: [0, 0]
                        }
                    }
                );
            });

            document.querySelectorAll("[data-overlayscrollbars-y]").forEach((element) => {
                OverlayScrollbars(
                    element,
                    {
                        overflow: { x: "hidden" },
                        update: {
                            elementEvents: [['textarea', 'input']],
                            debounce: [0, 0]
                        }
                    }
                );
            });
        </script>
    </body>
</html>
